<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Audit Catalog Images</title>
  <style>
    body { font-family: sans-serif; background: #0f172a; color: #fff; padding: 20px; }
    h1 { margin-bottom: 20px; font-size: 22px; }
    .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }
    .card { background: #1e293b; border-radius: 8px; overflow: hidden; border: 1px solid #334155; }
    .img-wrap { width: 100%; height: 180px; background: #000; }
    img { width: 100%; height: 100%; object-fit: cover; }
    .info { padding: 10px; }
    .title { font-size: 13px; font-weight: bold; margin-bottom: 4px; }
    .desc { font-size: 11px; color: #94a3b8; }
    .tag { display: inline-block; padding: 2px 6px; border-radius: 4px; font-size: 10px; background: #3b82f6; margin-bottom: 4px; }
  </style>
</head>
<body>
  <h1>Audit Images Test</h1>
  <div class="grid" id="grid"></div>

  <script>
    const items = [
      {
        tag: 'Sports & Fitness',
        name: 'Nivia Storm Football Size 5',
        desc: 'Professional football PU construction',
        img: 'https://images.unsplash.com/photo-1579952363873-27f3bade9f55?w=500'
      },
      {
        tag: 'Sports & Fitness',
        name: 'Dumbbells Set 10kg (5kg x 2)',
        desc: 'Rubber-coated hexagonal dumbbells',
        img: 'https://images.unsplash.com/photo-1584735935682-2f2b69dff9d2?w=500'
      },
      {
        tag: 'Sports & Fitness',

      {

      },
      {
        tag: 'Sports & Fitness',
        name: 'Resistance Bands Set (5 Bands)',

        img: 'https://images.unsplash.com/photo-1518611012118-696072aa579a?w=500'
      },
      {
        tag: 'Sports & Fitness',
        name: 'Skipping Rope with Counter',
        desc: 'Adjustable jump rope with handles',
        img: 'https://images.unsplash.com/photo-1599058917212-d750089bc07e?w=500'
      },
      {
        tag: 'Sports & Fitness',

      },
      {

      {
        tag: 'Home & Kitchen',

      {
        tag: 'Home & Kitchen',

      {
        tag: 'Electronics',

        desc: '6.8 inch e-reader display',
        img: 'https://images.unsplash.com/photo-1544717302-de2939b7ef71?w=500'
      }
    ];

    document.getElementById('grid').innerHTML = items.map(it => `
      <div class="card">
        <div class="img-wrap">
          <img src="${it.img}" alt="${it.name}" onerror="this.style.background='red'" />
        </div>
        <div class="info">
          <span class="tag">${it.tag}</span>
          <div class="title">${it.name}</div>
          <div class="desc">${it.desc}</div>
        </div>
      </div>
    `).join('');
  </script>
</body>
</html>
